<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CuteApp</title>
</head>
<body>
    <div class="app-header">
        <img src="images/littleBunny.jpg" class="icon">
        <span>My Cute App</span>
    </div>
    <div class="controls">
        <button id="minimizeButton">
            —
        </button>

        <button id="closeButton">
            X
        </button>
    </div>
    <div class="app">
        <img src="" class="image">

        <audio id="music-player" src=""></audio>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" max="100">
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <div class="song-title-container">
                    <div id="song-title-display"></div>
                </div>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button id="prevBtn"><img src="images/previousButton.png" alt=""></button>
            <button id="playBtn"><img src="images/playButton.png" class="playBtn"></button>
            <button id="nextBtn"><img src="images/nextButton.png" alt=""></button>
        </div>
    </div>

    <script src="songs.js"></script>
    <script src="script.js"></script>
</body>
</html>
